<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12121a"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#00c8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffaa;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffaa" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
 
  <!-- Grid overlay -->
  <rect width="512" height="512" rx="100" fill="url(#grid)"/>
 
  <!-- Outer border glow -->
  <rect width="512" height="512" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4"/>
 
  <!-- Glow circle behind % -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>
 
  <!-- % sign — large, centered, glowing -->
  <text
    x="256" y="300"
    font-family="'Space Mono', 'Courier New', monospace"
    font-size="260"
    font-weight="700"
    text-anchor="middle"
    fill="url(#accentGrad)"
    filter="url(#glowFilter)"
  >%</text>
 
  <!-- Decorative corner dots — top left -->
  <circle cx="60" cy="60" r="5" fill="#00ffaa" opacity="0.5"/>
  <circle cx="85" cy="60" r="3" fill="#00ffaa" opacity="0.3"/>
  <circle cx="60" cy="85" r="3" fill="#00ffaa" opacity="0.3"/>
 
  <!-- Decorative corner dots — top right -->
  <circle cx="452" cy="60" r="5" fill="#00c8ff" opacity="0.5"/>
  <circle cx="427" cy="60" r="3" fill="#00c8ff" opacity="0.3"/>
  <circle cx="452" cy="85" r="3" fill="#00c8ff" opacity="0.3"/>
 
  <!-- Bottom label -->
  <text
    x="256" y="452"
    font-family="'Courier New', monospace"
    font-size="52"
    font-weight="700"
    text-anchor="middle"
    fill="#00ffaa"
    opacity="0.9"
    letter-spacing="8"
  >PERCENTA</text>
 
  <!-- Thin underline accent -->
  <line x1="96" y1="465" x2="416" y2="465" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
</svg>